<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="বিসিএস, ব্যাংক ও প্রাইমারি চাকরির পূর্ণাঙ্গ প্রিলি, রিটেন, ভোকাব, ভাইভা ও লাইভ মডেল টেস্ট প্ল্যাটফর্ম।" />

  <!-- PWA & Mobile App Meta -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PrepBox BD" />

  <title>PrepBox BD — বিসিএস, ব্যাংক ও প্রাইমারি প্রস্তুতি</title>

  <!-- Google Fonts: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- রিলোডের সাথে সাথেই ডার্ক মোড অ্যাপ্লাই (সাদা ফ্ল্যাশ প্রতিরোধ) -->
  <script>
    if (localStorage.getItem('pb_dark') === '1') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Hind Siliguri"', 'sans-serif'] }
        }
      }
    };
  </script>

  <!-- KaTeX (গণিত ও বিজ্ঞানের সূত্র রেন্ডারিং) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Lucide Icons & Supabase Client -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button, a, input, select, textarea {
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .safe-pb { padding-bottom: env(safe-area-inset-bottom, 0px); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased pb-24 transition-colors duration-200">

  <!-- অফলাইন সতর্কতা ব্যানার -->
  <div id="offlineBanner" class="hidden sticky top-0 z-50 bg-rose-600 text-white text-center text-xs font-bold py-2 px-4 shadow-md">
    ⚠️ ইন্টারনেট সংযোগ বিচ্ছিন্ন! সংযোগ ফিরে এলে পুনরায় চেষ্টা করুন।
  </div>

  <!-- মূল অ্যাপ কনটেইনার -->
  <div id="app" class="min-h-screen flex flex-col">
    <div class="flex-1 flex items-center justify-center p-6">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-teal-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        <p class="text-slate-600 dark:text-slate-300 font-semibold text-sm">PrepBox BD লোড হচ্ছে...</p>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold text-white max-w-[92vw] text-center"></div>

  <!-- স্মার্ট এরর হ্যান্ডলিং, নেটওয়ার্ক স্ট্যাটাস ও PWA রেজিস্ট্রেশন -->
  <script>
    window.__APP_READY__ = false;
    window.__deferredInstallPrompt = null;

    function notifySafeError(msg) {
      if (typeof window.showToast === 'function') {
        window.showToast(msg, true);
        return;
      }
      var toast = document.getElementById('toast');
      if (toast) {
        toast.textContent = msg;
        toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold text-white bg-rose-600 max-w-[92vw] text-center';
        toast.classList.remove('hidden');
        setTimeout(function () { toast.classList.add('hidden'); }, 4000);
      }
    }

    function showStartupError(msg) {
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML =
        '<div class="min-h-screen flex items-center justify-center p-6">' +
          '<div class="max-w-sm w-full bg-white dark:bg-slate-900 border border-rose-200 dark:border-rose-900 rounded-2xl p-6 text-center shadow-lg space-y-3">' +
            '<p class="text-2xl">⚠️</p>' +
            '<h2 class="font-bold text-base text-rose-600">অ্যাপটি লোড করতে সমস্যা হয়েছে</h2>' +
            '<p class="text-xs text-slate-600 dark:text-slate-300 break-words">' + String(msg || 'অজানা ত্রুটি') + '</p>' +
            '<button onclick="location.reload()" class="w-full py-2.5 bg-teal-600 text-white text-xs font-bold rounded-xl">পুনরায় চেষ্টা করুন</button>' +
          '</div>' +
        '</div>';
    }

    // স্ক্রিপ্ট বা রানটাইম এরর ক্যাচ
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        showStartupError('প্রয়োজনীয় ফাইল লোড হয়নি: ' + e.target.src);
      } else if (e.message) {
        if (!window.__APP_READY__) showStartupError(e.message);
        else notifySafeError('ত্রুটি: ' + e.message);
      }
    }, true);

    // নেটওয়ার্ক বা Async এরর হলে চলমান পরীক্ষা না মুছে শুধু Toast দেখাবে
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason || 'নেটওয়ার্ক সমস্যা');
      if (!window.__APP_READY__) showStartupError(reason);
      else notifySafeError('নেটওয়ার্ক ত্রুটি: ' + reason);
    });

    // অনলাইন / অফলাইন ডিটেকশন
    function updateNetworkBanner() {
      var banner = document.getElementById('offlineBanner');
      if (!banner) return;
      if (navigator.onLine) banner.classList.add('hidden');
      else banner.classList.remove('hidden');
    }
    window.addEventListener('online', updateNetworkBanner);
    window.addEventListener('offline', updateNetworkBanner);
    updateNetworkBanner();

    // PWA ইনস্টল প্রম্পট সংরক্ষণ
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      if (typeof window.render === 'function' && window.__APP_READY__) {
        window.render();
      }
    });

    // Service Worker রেজিস্ট্রেশন
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>

  <!-- ৯টি মডুলার অ্যাপ স্ক্রিপ্ট -->
  <script src="js/core.js?v=2"></script>
  <script src="js/preli.js?v=2"></script>
  <script src="js/written.js?v=2"></script>
  <script src="js/vocab.js?v=2"></script>
  <script src="js/columns.js?v=2"></script>
  <script src="js/viva.js?v=2"></script>
  <script src="js/live.js?v=2"></script>
  <script src="js/admin.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
